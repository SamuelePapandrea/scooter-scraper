# Giro orario: cerca i nuovi annunci e li manda su Telegram.
# Lo avvia ogni ora cron-job.org (puntuale); il "schedule" di GitHub resta come riserva,
# ma salta il giro se ne e' gia' stato fatto uno negli ultimi 45 minuti.
# Gira dalle 6 alle 22 ora italiana (l'ultimo giro parte alle 22, di notte si ferma).
# Lo stato (annunci gia' visti) viene salvato nel repository in stato.json.
name: Giro orario
on:
  schedule:
    # GitHub usa l'ora UTC: 4-21 UTC copre 6-22 italiane sia con l'ora solare sia con quella legale;
    # le ore in piu' ai bordi vengono saltate dal controllo qui sotto.
    - cron: "7 4-21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: giro
  cancel-in-progress: false
jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Controlla se il giro serve
        id: ora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          ora=$(TZ=Europe/Rome date +%-H)
          if [ "$ora" -ge 23 ] || [ "$ora" -lt 6 ]; then
            echo "notte=1" >> "$GITHUB_OUTPUT"; echo "Sono le $ora in Italia: giro saltato."; exit 0
          fi
          ultimo=$(gh run list -R "$GITHUB_REPOSITORY" --workflow orario.yml --status success --limit 1 --json createdAt -q '.[0].createdAt // ""')
          if [ -n "$ultimo" ] && [ $(( $(date +%s) - $(date -d "$ultimo" +%s) )) -lt 2700 ]; then
            echo "notte=1" >> "$GITHUB_OUTPUT"; echo "Giro gia' fatto alle $ultimo: salto."
          fi
      - uses: actions/checkout@v4
        if: steps.ora.outputs.notte != '1'
      - uses: actions/setup-python@v5
        if: steps.ora.outputs.notte != '1'
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.ora.outputs.notte != '1'
      - name: Cerca e invia
        if: steps.ora.outputs.notte != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - name: Salva lo stato
        if: always() && steps.ora.outputs.notte != '1'
        run: |
          [ -f stato.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato.json
          git diff --cached --quiet || git commit -m "Aggiorna stato"
          # il bot puo' aver pubblicato ricerche.md nel frattempo: si riprova qualche volta
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep 10; done; exit 1
