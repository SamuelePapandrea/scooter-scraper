# Prova manuale: controlla quali siti rispondono dai server di GitHub.
# Non invia nulla su Telegram e non usa nessun segreto.
name: Prova siti
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper.py --prova --solo 3
